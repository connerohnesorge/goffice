name: E2E Visual Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'presentation/**'
      - 'drawingml/**'
      - '.github/workflows/e2e-visual-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'presentation/**'
      - 'drawingml/**'

jobs:
  e2e-visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Nix cache
        uses: cachix/cachix-action@v15
        with:
          name: devenv
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('tests/e2e/generators/csharp/**/packages.lock.json', 'tests/e2e/generators/csharp/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Go generator
        run: |
          nix develop --command bash -c "
            cd tests/e2e/generators/go
            go build -v -o e2e-go-generator .
          "

      - name: Build C# generator
        run: |
          nix develop --command bash -c "
            cd tests/e2e/generators/csharp
            dotnet restore
            dotnet build -c Release
          "

      - name: Run E2E tests
        run: |
          nix develop --command bash -c "
            cd tests/e2e
            go test -v -timeout 20m ./...
          "

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: tests/e2e/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            tests/e2e/output/
            tests/e2e/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## E2E Visual Test Results\n\n';

            try {
              const resultsPath = 'tests/e2e/reports/results.json';
              if (fs.existsSync(resultsPath)) {
                const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                summary += `- **Passed:** ${results.passed || 0}\n`;
                summary += `- **Failed:** ${results.failed || 0}\n`;
                summary += `- **Skipped:** ${results.skipped || 0}\n`;
                summary += `\n**Total:** ${(results.passed || 0) + (results.failed || 0) + (results.skipped || 0)}\n`;

                if (results.failed > 0) {
                  summary += '\n:warning: Some tests failed. Check the artifacts for details.\n';
                } else if (results.passed > 0) {
                  summary += '\n:white_check_mark: All tests passed!\n';
                }
              } else {
                summary += '_No results file found_\n';
              }
            } catch (e) {
              summary += `_Error reading results: ${e.message}_\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
